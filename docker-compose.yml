services:
  api:
    build: .
    container_name: pulse-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8088}:${APP_PORT:-8088}"
    volumes:
      - ./public/download:/app/public/download
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 150M